[project]
name = "cleopatra"
version = "0.26.1"
description = "visualization package"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GNU General Public License v3" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.come" }
]
keywords = ["matplotlib", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers"
]

dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.4.9",
    "hpc-utils>=0.1.4",
]

[project.optional-dependencies]
tiles = [
    "mercantile>=1.2.1",
    "pillow>=12.1.1",
    "pyproj>=3.7.2",
    "xyzservices>=2026.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pre-commit>=3.7.1",
    "pre-commit-hooks>=4.6.0",
    "nbval>=0.11.0",
    "mypy>=1.10.0",
]

docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mike>=2.1.3",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-autorefs>=1.2",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-table-reader-plugin>=3.1.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "jupyter-contrib-nbextensions>=0.7.0",
    "notebook<7.0",
    "jupyter",
    "commitizen (>=4.8.3,<5.0.0)",
]
notebook = [
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]

[project.urls]
Homepage = "https://github.com/serapeum-org/cleopatra"
Documentation = "https://serapeum-org.github.io/cleopatra/"
Repository = "https://github.com/serapeum-org/cleopatra"



[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
changelog_incremental = true
changelog_merge_prerelease = true
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{change_type}}:{% if show_message %} {{message}}{% endif %}"
example = "feature: this feature enables customize through config file"
schema = "<type>: <body>"
schema_pattern = "(feat|fix|refactor|perf|build|ci|chore)(\\(.+\\))?: (.+)"
changelog_pattern = "^(feat|fix|refactor|perf|build|ci|chore)(\\(.+\\))?(!)?:"
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf", "build", "ci", "chore"]


[tool.hatch.build.targets.wheel]
packages = ["src/cleopatra"]


# extend-ignore (NOT ignore) so flake8's default-ignore list is preserved —
# that default list already silences the black-conflict codes E704/W503/W504.
# E203, E701 are Black's officially recommended flake8 ignores; the rest are
# project style choices. See:
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html
[tool.flake8]
extend-ignore = ["E203", "E266", "E501", "E701", "E704", "E722", "C901", "E741", "E731", "W503"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

# nbqa runs flake8 on notebook code cells. Tutorial notebooks intentionally place
# imports next to where they are first used (teaching in context), and setup such as
# `%matplotlib inline` must run before imports — both legitimately trip E402. E402
# stays enforced for real .py modules; it is ignored only for notebooks here.
[tool.nbqa.addopts]
flake8 = ["--extend-ignore=E402"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "planning"]
skips = ["B101"]

# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy 2.5
# ships PEP 695 `type` statements in its stubs, which mypy only parses when the
# target is >= 3.12 (at 3.11 it aborts with a syntax error before checking any
# source). This only widens the *typing* target; actual 3.11 runtime
# compatibility is covered by the test matrix, not by mypy.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cleopatra"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "planning/",
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
testpaths = ["tests"]
norecursedirs = ["docs"]
markers = [
    "slow: mark test as slow.",
    "fast: mark test as fast.",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')"
]

#[tool.uv]
#managed = false

[build-system]
# Cap below 1.30: hatchling 1.30 emits Metadata-Version 2.5, which twine
# (<=6.2.0) rejects on upload. Drop the cap once twine supports 2.5.
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"
