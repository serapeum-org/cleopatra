[project]
name = "cleopatra"
version = "0.27.0"
description = "visualization package"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "GNU General Public License v3" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.come" }
]
keywords = ["matplotlib", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers"
]

dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9",
    "imageio-ffmpeg>=0.4.9",
    "hpc-utils>=0.1.4",
]

[project.optional-dependencies]
tiles = [
    "pillow>=12.1.1",
    "pyproj>=3.7.2",
    "xyzservices>=2026.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pre-commit>=3.7.1",
    "pre-commit-hooks>=4.6.0",
    "nbval>=0.11.0",
    "mypy>=1.10.0",
]

docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mike>=2.1.3",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-autorefs>=1.2",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-table-reader-plugin>=3.1.0",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "jupyter-contrib-nbextensions>=0.7.0",
    "notebook<7.0",
    "jupyter",
    "commitizen (>=4.8.3,<5.0.0)",
]
notebook = [
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]

[project.urls]
Homepage = "https://github.com/serapeum-org/cleopatra"
Documentation = "https://serapeum-org.github.io/cleopatra/"
Repository = "https://github.com/serapeum-org/cleopatra"



[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
changelog_incremental = true
changelog_merge_prerelease = true
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{change_type}}:{% if show_message %} {{message}}{% endif %}"
example = "feature: this feature enables customize through config file"
schema = "<type>: <body>"
schema_pattern = "(feat|fix|refactor|perf|build|ci|chore)(\\(.+\\))?: (.+)"
changelog_pattern = "^(feat|fix|refactor|perf|build|ci|chore)(\\(.+\\))?(!)?:"
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf", "build", "ci", "chore"]


[tool.hatch.build.targets.wheel]
packages = ["src/cleopatra"]


[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black had skip-string-normalization = true → preserve existing quotes.
quote-style = "preserve"

[tool.ruff.lint]
# The *effective* flake8 rule set was E/F/W: the old config's B/C/T4 selectors
# were inert (flake8-bugbear / flake8-print were never installed as
# additional_dependencies). Add I (isort) and UP (pyupgrade) to fold in those
# two standalone hooks.
select = ["E", "F", "W", "I", "UP"]
# Mirror the old [tool.flake8].extend-ignore. E704 and W503 are dropped — ruff
# does not implement either (both are formatter-owned pycodestyle codes black
# conflicts with), so there is nothing to ignore.
ignore = ["E203", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded examples/ and tests/ from linting, and the old bare pyupgrade
# never modernized their typing — so drop E/F/W and UP there, keeping only
# import-sorting (I), which isort did run everywhere.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
# Tutorial notebooks import next to first use and run setup (e.g. `%matplotlib
# inline`) before imports — both legitimately trip E402, which stays enforced
# for real .py modules; it is ignored only for notebooks here.
"*.ipynb" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "planning"]
skips = ["B101"]

# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy 2.5
# ships PEP 695 `type` statements in its stubs, which mypy only parses when the
# target is >= 3.12 (at 3.11 it aborts with a syntax error before checking any
# source). This only widens the *typing* target; actual 3.11 runtime
# compatibility is covered by the test matrix, not by mypy.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cleopatra"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "planning/",
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
testpaths = ["tests"]
norecursedirs = ["docs"]
markers = [
    "slow: mark test as slow.",
    "fast: mark test as fast.",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')"
]

#[tool.uv]
#managed = false

[build-system]
# Cap below 1.30: hatchling 1.30 emits Metadata-Version 2.5, which twine
# (<=6.2.0) rejects on upload. Drop the cap once twine supports 2.5.
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"
