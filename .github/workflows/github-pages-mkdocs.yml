name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'  # Match all branches for pull requests
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  # Gate every deploy on a warnings-as-errors build. The deploy action builds
  # non-strict, so a broken nav entry, a dangling anchor or a malformed
  # docstring would publish silently — this fails the run instead.
  build-strict:
    # Skip on a FAILED upstream github-release: a failed release uploaded no release-ref artifact, so the
    # download step below would error and red this "Deploy MkDocs" run for a failure that has nothing to do
    # with docs. Every non-workflow_run event (push / pull_request / release) still runs unconditionally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the
    # deploy jobs, not for this one. A pull-request run therefore has no write
    # path to gh-pages at all.
    permissions:
      contents: read
      # download the release-ref artifact on the workflow_run path (cross-run)
      actions: read
    steps:
    - name: Download the release ref from the github-release run
      # Gate the SAME tree the deploy jobs publish: on workflow_run / release that is the released commit /
      # tag (the bump + new changelog), not pre-bump main -- else a page that only exists on the release
      # branch would pass --strict yet still publish. On push / pull_request this is skipped and checkout
      # uses its default ref (the PR merge commit), so fork-controlled code never reaches a write-scoped job.
      # continue-on-error: a draft release (or a run that did not upload) leaves no artifact; let the job
      # continue and the resolve step fall back to gating the default tree instead of erroring here.
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-ref
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .release-ref

    - name: Resolve the ref to gate
      id: ref
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          workflow_run)
            if [ -f .release-ref/release-ref.txt ]; then
              REF="$(cat .release-ref/release-ref.txt)"
              [ -n "$REF" ] || { echo "::error::empty release ref"; exit 1; }
            else
              echo "no release-ref artifact (draft or non-publishing run); gating the default tree"
              REF=""
            fi ;;
          release) REF="$RELEASE_REF" ;;
          *) REF="" ;;
        esac
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    # On push / pull_request REF is empty, so checkout uses its own default ref -- the merge commit on a
    # pull_request, never the fork's head, so fork-controlled code stays out of this job. On workflow_run /
    # release REF is the released commit/tag, so the --strict gate checks the exact tree the deploy publishes.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history so a checkout by the released commit SHA resolves (a shallow fetch of a non-tip SHA
        # can fail). plain `mkdocs build` itself reads no git history (no git-revision-date plugin).
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ steps.ref.outputs.ref }}

    # The same setup the deploy jobs get. mkdocs-deploy calls this action
    # internally with these inputs, so reusing it here keeps the gate and the
    # deploy on one environment; installing the toolchain by hand would let the
    # two drift and defeat the point of gating. Pin the SAME python-setup/uv ref
    # that mkdocs-deploy@mkdocs/v1.3.1 uses internally, so the gate and the
    # deploy resolve dependencies with one uv version.
    - uses: serapeum-org/github-actions/actions/python-setup/uv@e7eed59dddcd11280e26b46930dbe5bee8b746b1 # uv/v1.2.2
      with:
        python-version: '3.12'
        install-groups: 'groups: docs, extras: tiles science-colors'
        verify-lock: false

    # The setup action puts .venv on GITHUB_PATH, so call mkdocs straight from
    # it. Going back through `uv run` would re-enter dependency resolution for a
    # build whose environment is already installed.
    #
    # Scope of this gate: it catches nav / anchor / docstring warnings
    # (`--strict` turns every MkDocs warning into an error). It does NOT execute
    # notebooks (no notebooks-path here; mkdocs-jupyter renders committed outputs
    # with execute=false), so a notebook-execution regression is still caught by
    # the deploy jobs, not here. On the `workflow_run` / `release` path it checks
    # the exact released tree (the release-ref handoff above), not pre-bump main.
    - name: Build docs with --strict
      run: mkdocs build --strict --site-dir /tmp/site

    # A pull request builds the site but no longer publishes it (#404): each PR
    # deploy was a full site commit on the shared `gh-pages` branch, and nothing
    # ever pruned them, so the branch grew without bound. The --strict build
    # above is the gate, and reviewers who want to look at the rendered pages
    # download them from here instead of a published preview.
    - name: Upload the built site for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-pr-${{ github.event.pull_request.number }}
        path: /tmp/site
        retention-days: 7

  # deploy-main / deploy-release are not serialised against each other: mkdocs-deploy retries the shared
  # gh-pages push (mike_push.sh), so each completes. Never add a WORKFLOW-level concurrency group here — it
  # would also evict the build-strict gate. deploy-release does carry its own JOB-level group (below), which
  # is safe (it never touches build-strict) and only stops a UI/PAT release — which fires both the `release`
  # and `workflow_run` events — from running two release deploys at once.
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'main'
        package-manager: 'uv'
        python-version: '3.12'
        install-groups: 'groups: docs, extras: tiles science-colors'
        notebooks-path: 'docs/notebooks'
        notebooks-exclude: '**/.ipynb_checkpoints/**'
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    # Security: when triggered via `workflow_run`, require that the upstream
    # workflow ran from the base repository (not a fork) so we can never run
    # untrusted code in a context that holds `ACTIONS_DEPLOY_TOKEN`.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    needs: build-strict
    runs-on: ubuntu-latest
    # Serialize release-docs deploys so two runs never race on gh-pages (mike deploy + prune). A UI/PAT-
    # published release fires BOTH the `release` and `workflow_run` events; a constant group makes the second
    # wait instead of corrupting the branch. The bot path fires only workflow_run, so this is normally a no-op.
    concurrency:
      group: mkdocs-deploy-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      # Download the release-ref artifact from the github-release run (cross-run fetch).
      actions: read
    steps:
    - name: Download the release ref from the github-release run
      # github-release cuts the version bump + tag on the release branch, not on the dispatch ref, so on the
      # workflow_run path head_sha/head_branch point at pre-bump main. Fetch the released commit SHA it
      # recorded and deploy from there, so the versioned docs reflect the released version -- the same
      # release-ref handoff pypi-release uses. (Without it, deploy-release publishes OLD docs + regresses
      # `latest`.)
      # continue-on-error: a draft release leaves no artifact; let the job continue so the resolve step can
      # skip the deploy cleanly instead of erroring on the missing file.
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-ref
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .release-ref

    - name: Resolve the ref to deploy
      id: ref
      env:
        EVENT_NAME: ${{ github.event_name }}
        # Fallback serves the `release` event, where github.ref is refs/tags/<tag> (the released tag).
        FALLBACK_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_run" ]; then
          # No artifact => draft release (or a run that did not upload); nothing to deploy, skip cleanly.
          if [ ! -f .release-ref/release-ref.txt ]; then
            echo "no release-ref artifact (draft or non-publishing run); skipping release docs deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="$(cat .release-ref/release-ref.txt)"
          [ -n "$REF" ] || { echo "::error::empty release ref"; exit 1; }
        else
          REF="$FALLBACK_REF"
        fi
        echo "resolved ref: ${REF}"
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.ref.outputs.skip != 'true'
      with:
        fetch-depth: 0
        # workflow_run: the released commit SHA from the release-ref artifact (the tree that holds the bump);
        # `release` event: the published tag. Both carry the released version. The release-ref SHA comes
        # from the gated, fork-guarded release run, so it is trusted input (CWE-829: untrusted-checkout) --
        # the fork guard in `if:` above keeps untrusted code out.
        ref: ${{ steps.ref.outputs.ref }}

    - name: Extract version from pyproject.toml
      id: version
      if: steps.ref.outputs.skip != 'true'
      # Anchor on `version` + `=` so it cannot match `version_provider` under [tool.commitizen]. On a
      # `release` event, assert the published tag_name equals the committed version so the deploy tag and the
      # prune floor (KEEP_VERSION) cannot diverge and prune the version just deployed.
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        VERSION=$(grep -m1 '^version[[:space:]]*=' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        if [ -n "${TAG_NAME:-}" ] && [ "$TAG_NAME" != "$VERSION" ]; then
          echo "::error::release tag '$TAG_NAME' != pyproject version '$VERSION'"; exit 1
        fi
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      if: steps.ref.outputs.skip != 'true'
      with:
        trigger: 'release'
        package-manager: 'uv'
        python-version: '3.12'
        install-groups: 'groups: docs, extras: tiles science-colors'
        notebooks-path: 'docs/notebooks'
        notebooks-exclude: '**/.ipynb_checkpoints/**'
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'

    # Retain `main` plus the RETAIN_RELEASES most recent releases, and delete
    # anything else — older releases, and the now-frozen `develop` that the
    # removed PR deploy used to publish.
    #
    # Why a cap at all: each version directory is a full copy of the site, so
    # retaining every release grows the published site without bound. On the
    # sibling earthlens repo this reached 9.7 GB, at which point GitHub Pages
    # stopped building entirely and the current release's documentation was
    # never published despite being on the branch. GitHub documents a 1 GB
    # published-site limit, but that is not the observed threshold: multi-GB is
    # the danger zone. If a release ever fails to publish, lower RETAIN_RELEASES
    # before anything else.
    #
    # `main` is always retained: deploy-main republishes it on every push, so
    # deleting it here would only have it return minutes later.
    #
    # Auth comes from the checkout above, the same way the deploy's own pushes
    # work. mike is on PATH because mkdocs-deploy's internal python-setup/uv puts
    # the virtualenv on GITHUB_PATH for subsequent steps in this job.
    #
    # Failure handling: the 3-attempt retry below absorbs a transient gh-pages
    # push race (the common, benign case). Anything that survives all retries,
    # or a precondition/config error (missing `mike`, unresolved version), fails
    # this step on purpose — it is NOT marked continue-on-error. A silently
    # skipped prune would let gh-pages resume the unbounded growth this workflow
    # exists to prevent, behind green checks, which is the worst outcome. The
    # release docs are already published by the deploy step above, so a red
    # prune signals "cleanup needs attention", not "the release failed".
    - name: Prune superseded documentation versions
      if: steps.ref.outputs.skip != 'true'
      env:
        KEEP_VERSION: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        RETAIN_RELEASES: '5'
      run: |
        set -euo pipefail
        if [ -z "$KEEP_VERSION" ]; then
          echo "::error::no release version resolved; refusing to prune"
          exit 1
        fi
        # Re-sync, recompute and retry as a unit: a concurrent main deploy moves
        # gh-pages, which makes mike's fast-forward push lose the race, and the
        # stale list computed against the old tip must not be reused. The fetch
        # is inside the loop so a transient failure retries rather than aborting.
        for attempt in 1 2 3; do
          if ! git fetch origin gh-pages; then
            echo "::warning::git fetch gh-pages failed (attempt ${attempt}/3); retrying"
            sleep $(( attempt * 3 ))
            continue
          fi
          git branch -f gh-pages FETCH_HEAD

          # `awk '{print $1}'` takes the version id (first field); mike prints
          # `<version> [aliases]` and our deploys set no custom `--title`, so the
          # id is always field 1.
          mike list | awk '{print $1}' | sort -u > /tmp/mike-all
          # `sort -V` is load-bearing: a lexical sort ranks 0.9.0 above 0.11.0
          # and would retain the wrong five. The `v?` tolerates a future
          # `v`-prefixed tag; the filter is otherwise coupled to commitizen's
          # `tool.commitizen.tag_format` (bare `$version` today). Only release
          # ids count here, so `develop` and any alias-only row fall through to
          # the delete set rather than consuming a retention slot. `|| true`
          # keeps a no-match `grep` from aborting the step under `pipefail`; the
          # `awk NR<=n` reads all of `sort`'s output (unlike `head`, which could
          # close the pipe early and SIGPIPE `sort` under `pipefail`).
          { grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' /tmp/mike-all || true; } \
            | sort -rV | awk -v n="$RETAIN_RELEASES" 'NR<=n' > /tmp/mike-keep-releases
          # KEEP_VERSION is listed explicitly as a floor: the release that was
          # just deployed must survive even if it somehow sorts outside the top
          # RETAIN_RELEASES. The keep-list and mike-all share one (lexical `sort
          # -u`) collation so `comm -23` below pairs them correctly.
          { echo main; echo "$KEEP_VERSION"; cat /tmp/mike-keep-releases; } \
            | grep -v '^$' | sort -u > /tmp/mike-keep
          # Blanket policy: anything not in the keep-list is deleted, so a
          # version deployed out-of-band (a manual alias, a two-component tag)
          # is reaped on the next release. Only `main` + semver releases survive.
          stale=$(comm -23 /tmp/mike-all /tmp/mike-keep | tr '\n' ' ')

          if [ -z "$stale" ]; then
            echo "nothing to prune; retaining $(tr '\n' ' ' < /tmp/mike-keep)"
            exit 0
          fi
          echo "retaining $(tr '\n' ' ' < /tmp/mike-keep)"
          echo "deleting: $stale"
          if mike delete --push $stale; then
            exit 0
          fi
          echo "::warning::prune lost a gh-pages push race (attempt ${attempt}/3); retrying"
          sleep $(( attempt * 3 ))
        done
        echo "::error::could not prune superseded documentation versions after 3 attempts"
        exit 1
