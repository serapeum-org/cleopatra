name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'  # Match all branches for pull requests
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  deploy-pr:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      # Serialize with deploy-main: both push to the shared gh-pages branch,
      # and running them concurrently races the git push (non-fast-forward
      # rejection). deploy-release is deliberately excluded from this group —
      # a release deploy must run to completion regardless of any PR or other
      # release build in flight.
      concurrency:
        group: mkdocs-deploy-pr-main
        cancel-in-progress: false
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
        with:
          trigger: 'pull_request'
          package-manager: 'uv'
          python-version: '3.12'
          install-groups: 'groups: docs, extras: tiles'
          notebooks-path: 'docs/notebooks'
          notebooks-exclude: '**/.ipynb_checkpoints/**'
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: mkdocs-deploy-pr-main
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'main'
        package-manager: 'uv'
        python-version: '3.12'
        install-groups: 'groups: docs, extras: tiles'
        notebooks-path: 'docs/notebooks'
        notebooks-exclude: '**/.ipynb_checkpoints/**'
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'release'
        package-manager: 'uv'
        python-version: '3.12'
        install-groups: 'groups: docs, extras: tiles'
        notebooks-path: 'docs/notebooks'
        notebooks-exclude: '**/.ipynb_checkpoints/**'
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        mike-alias: 'latest'
