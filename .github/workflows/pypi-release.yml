# Build and publish the Python package to PyPI using the Serapieum composite action.

name: pypi-release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by download-artifact to fetch the release-ref artifact from the github-release run (cross-run).
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download the release ref from the github-release run
        # On the workflow_run (release) path, github-release cut the version bump + lockfile commit on the
        # release branch and uploaded its name as the `release-ref` artifact. Fetch it so we publish the tree
        # that actually holds the bump -- not head_branch, which is the dispatched ref, not necessarily that
        # branch. A dispatch run of this workflow skips this and falls back to github.ref_name below.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .release-ref

      - name: Resolve the ref to publish
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          FALLBACK_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REF="$(cat .release-ref/release-ref.txt)"
            [ -n "$REF" ] || { echo "::error::empty release ref -- refusing to publish the default branch"; exit 1; }
          else
            REF="$FALLBACK_REF"
          fi
          echo "resolved ref: ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Build and publish to PyPI
        uses: serapeum-org/github-actions/actions/release/pypi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pypi-release/v1.0.3
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          python-version: '3.12'
          package-manager: 'uv'
          install-groups: "groups: dev"
          verify-lock: 'false'
