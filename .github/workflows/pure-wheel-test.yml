name: Pure Wheel - Build & Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / ref to build and test (defaults to the ref selected in the UI)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      branch:
        description: "Ref to build and test (passed by the calling workflow)"
        required: false
        default: ""
        type: string

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up uv
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          version: '0.12.1'
          python-version: "3.12"
          install-groups: "groups: dev"
          verify-lock: true

      - name: Build wheel
        run: uv run --active --frozen --no-build --no-sync python -m build --wheel --outdir dist/

      - name: Verify package layout in wheel
        # A src-layout or packaging regression that dropped a subpackage would
        # still build an installable but empty wheel; check that the package
        # root and each top-level subpackage are present.
        run: |
          LISTING=$(uv run --active --frozen --no-build --no-sync python -m zipfile -l dist/*.whl)
          echo "$LISTING" | grep "cleopatra/__init__.py"
          echo "$LISTING" | grep "cleopatra/glyphs/__init__.py"
          echo "$LISTING" | grep "cleopatra/styling/__init__.py"
          echo "$LISTING" | grep "cleopatra/basemap/__init__.py"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  test-wheel-core:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel (no extras)
        # --only-binary=:all: is the whole point of a pure-wheel test: every
        # runtime dependency must install from a published wheel on this OS /
        # Python, never build from an sdist.
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}" --only-binary=:all:

      - name: Verify package import
        run: python -c "import cleopatra; print(cleopatra.__version__)"

      - name: Install test runner
        run: "pip install pytest==9.1.1 pytest-env==1.7.0 pytest-mock==3.17.0 pytest-timeout==2.4.0 --only-binary=:all:"

      - name: Run core tests
        # -o pythonpath= clears the `pythonpath = ["src"]` setting so the tests
        # import the INSTALLED wheel, not the source tree.
        run: pytest -vvv -sv -o pythonpath= tests/

  test-wheel-extras:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
        extra:
          - { name: tiles, pip_extra: "tiles", module: "cleopatra.basemap.tiles" }
          - { name: science-colors, pip_extra: "science-colors", module: "cleopatra.styling.colors" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel with only [${{ matrix.extra.name }}] extra
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[${{ matrix.extra.pip_extra }}]"

      - name: Verify package import
        run: python -c "import cleopatra; print(cleopatra.__version__)"

      - name: Verify the [${{ matrix.extra.name }}] module imports with its extra installed
        run: python -c "import cleopatra; import ${{ matrix.extra.module }}"

      - name: Install test runner
        run: "pip install pytest==9.1.1 pytest-env==1.7.0 pytest-mock==3.17.0 pytest-timeout==2.4.0 --only-binary=:all:"

      - name: Run the suite with the [${{ matrix.extra.name }}] extra present
        shell: bash
        run: pytest -vvv -sv -o pythonpath= tests/ || [ $? -eq 5 ]
