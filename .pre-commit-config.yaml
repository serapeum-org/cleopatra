fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        name: "[py -  check] check toml"
      - id: end-of-file-fixer
        name: "[file - format] end of file"
      - id: no-commit-to-branch
        name: "[git -  check] no commit to branch"
        args: [ --branch=main ]
      - id: trailing-whitespace
        name: "[file - format] trim trailing whitespace"
        args: [ --markdown-linebreak-ext=md ]
      - id: check-added-large-files
        name: "[file -  check] large file"
        args: [ --maxkb=2000 ]
      - id: check-docstring-first
        name: "[py   -  check] docstring first"
        files: /examples
        types : [file, python ]
      - id: check-json
        name: "[json -  check] validate json"
      - id: check-merge-conflict
        name: "[git  -  check] merge conflict"
      - id: debug-statements
        name: "[py   -  check] debug statements"
      - id: detect-private-key
        name: "[cred -  check] private keys"
      - id: mixed-line-ending
        name: "[file - format] mixed line ending"
        args: [ --fix=auto ]
      - id: pretty-format-json
        name: "[json - format] pretty json"
        # Exclude notebooks: .ipynb is JSON, but jupyter/nbformat owns its serialization
        # (indent=1, ensure_ascii=False). pretty-format-json's --indent=4 + ascii escapes
        # rewrite every notebook into a huge spurious diff on each run (and re-break the
        # code cells' unicode). Notebook code is already handled by ruff.
        exclude: \.ipynb$
        args: [ --autofix,
                --indent=4,
                --no-sort-keys ]
      - id: requirements-txt-fixer
        name: "[reqs - format] fix requirements.txt"
      - id: check-yaml
        name: "[yaml -  check] validate yaml"
        exclude: '^mkdocs\.yml$'

  # Ruff replaces black + isort + flake8 + pyupgrade and their nbqa notebook
  # wrappers. One engine and one line-length ruler mean the formatter and the
  # import sorter can't disagree the way black and isort did (a long trailing
  # comment on an import). Ruff lints and formats both .py and .ipynb natively.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: "[py   -   lint] ruff"
        args: [--fix]
      - id: ruff-format
        name: "[py   - format] ruff-format"

  # Strip outputs / execution counts from notebooks on commit. The example notebooks are
  # docs source and the docs build (github-pages-mkdocs.yml) re-executes them in CI, so
  # committed outputs are throwaway — this enforces that invariant, keeping a stray "ran it
  # locally" commit from reintroducing multi-MB output blobs or notebook diff noise.
  #   --keep-id: keep the original cell ids instead of renumbering them 0,1,2,… — positional
  #     ids reshuffle every subsequent cell whenever one is inserted, which is pure diff churn.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: "[ipynb - format] nbstripout"
        args: [--keep-id]

  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.4.3
    hooks:
      - id: beautysh
        name: "[bash - format] beautysh"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "[bash -   lint] shellcheck"

  - repo: https://github.com/rlindsgaard/pre-commit-commit-msg-hooks
    rev: 0.1.0
    hooks:
      - id: check-description-max-length
        name: "[bash -   format] check-description-max-length"
      - id: check-second-line-empty
        name: "[bash -   format] check-second-line-empty"
      - id: check-summary-capitalized
        name: "[bash -   format] check-summary-capitalized"
      - id: check-summary-imperative
        name: "[bash -   format] check-summary-imperative"
      - id: check-summary-max-length
        name: "[bash -   format] check-summary-max-length"
      - id: check-summary-punctuation
        name: "[bash -   format] check-summary-punctuation"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # The repo's single secret scanner (replaced detect-secrets + trufflehog).
      # This hook scans staged changes at commit time using ci/gitleaks.toml's
      # allowlist (planning/ notes, uv.lock hashes).
      - id: gitleaks
        name: "[cred -  check] gitleaks"
        args: ["--config", "ci/gitleaks.toml"]

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.8
    hooks:
      - id: checkov

#   - repo: local
#     hooks:
#       - id: safety
#         name: Safety Check
#         entry: safety scan --full-report
#         language: system
#         types: [python]
#         pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # The local hooks below run against the uv-managed `dev` environment.
  # `-p no:cacheprovider` stops pytest writing to .pytest_cache, which fails
  # with WinError 183 on this Google-Drive-synced tree.
  - repo: local
    hooks:
      - id: mypy
        name: "[py   -  type] mypy"
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest -v --cov=src/cleopatra --cov-report term-missing -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: notebook-check
        name: nbval
        entry: pytest --nbval-lax -p no:cacheprovider
        language: system
        files: \.ipynb$
        # One pytest session for every notebook passed. Otherwise pre-commit splits
        # the files across concurrent processes, producing several independent
        # sessions and letting notebooks that write into docs/ collide.
        require_serial: true
        always_run: true

  - repo: local
    hooks:
      - id: doctest
        name: doctest
        entry: python -c "import matplotlib; matplotlib.use('Agg'); import pytest; pytest.main(['--doctest-modules', '-p', 'no:cacheprovider'])"
        language: system
        files: ^src/cleopatra/.*\.py$
        always_run: true
